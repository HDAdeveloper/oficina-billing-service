# EXEMPLO: não aplique este arquivo e não coloque valores reais no Git.
# Crie o segredo de verdade (a pipeline/Terraform da Etapa 7 também pode fazer isso):
#
#   kubectl -n oficina create secret generic billing-service-secrets \
#     --from-literal=DB_USER=... --from-literal=DB_PASSWORD=... --from-literal=JWT_SECRET=...
#
# JWT_SECRET precisa ser o MESMO do OS Service (é ele que emite os tokens).
# O acesso ao SQS/SNS vem da role IAM do pod (IRSA), não de chaves neste segredo.
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  namespace: oficina
type: Opaque
stringData:
  DB_USER: "troque-me"
  DB_PASSWORD: "troque-me"
  JWT_SECRET: "troque-me-por-um-segredo-com-32-bytes-ou-mais"
  # Só com PAGAMENTO_PROVEDOR=mercadopago (ver docs/mercado-pago.md). Valores reais NUNCA no Git.
  # MERCADOPAGO_ACCESS_TOKEN: "APP_USR-..."
  # MERCADOPAGO_WEBHOOK_SECRET: "..."
