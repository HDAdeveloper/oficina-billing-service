apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: oficina
data:
  # RDS_BILLING_ENDPOINT e CONTA_AWS são trocados pelo script de deploy com as saídas do Terraform
  DB_URL: "jdbc:postgresql://RDS_BILLING_ENDPOINT:5432/oficina_billing"
  AWS_REGION: "us-east-1"
  BILLING_COMMANDS_QUEUE: "billing-commands"
  # ARN do tópico de eventos (o Terraform da Etapa 7 informa o valor real, com o id da conta)
  EVENTS_TOPIC_ARN: "arn:aws:sns:us-east-1:CONTA_AWS:oficina-saga-events"
  # New Relic (a licenca fica no segredo opcional "newrelic", nunca no Git)
  NEW_RELIC_APP_NAME: "oficina-billing-service"
  NEW_RELIC_LOG_FILE_NAME: "STDOUT"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
